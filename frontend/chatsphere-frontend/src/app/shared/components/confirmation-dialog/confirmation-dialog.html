<h2 mat-dialog-title>
  {{ data.title }}
</h2>

<mat-dialog-content>
  <p class="text-slate-600">
    {{ data.message }}
  </p>
</mat-dialog-content>

<mat-dialog-actions align="end">

  <button mat-button mat-dialog-close>
    {{ data.cancelText || 'Cancel' }}
  </button>

  <button
    mat-flat-button
    [mat-dialog-close]="true"
  >
    {{ data.confirmText || 'Confirm' }}
  </button>

</mat-dialog-actions>
