<header
  class="h-16 bg-white border-b border-slate-200
         flex items-center justify-between
         px-3 sm:px-6"
>

  <!-- Left -->
  <div class="min-w-0">
    <h1 class="text-lg sm:text-xl font-semibold text-slate-800 truncate">
      ChatSphere
    </h1>
  </div>

  <!-- Right -->
  <div>

    <button
      mat-button
      [matMenuTriggerFor]="userMenu"
      class="flex items-center gap-2"
    >

      <span
        class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-violet-600
               text-white flex items-center justify-center
               font-semibold text-sm sm:text-base"
      >
        RP
      </span>

      <!-- Hide name on very small screens -->
      <span class="hidden sm:inline text-slate-700">
        Rohit
      </span>

    </button>

    <mat-menu #userMenu="matMenu">

      <button mat-menu-item>
        Profile
      </button>

      <button mat-menu-item>
        Settings
      </button>

      <button
        mat-menu-item
        (click)="logout()"
      >
        Logout
      </button>

    </mat-menu>

  </div>

</header>
