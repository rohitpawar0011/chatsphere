<aside
  class="w-[76px] h-full bg-slate-950 text-white
         flex flex-col items-center py-6 gap-8"
>

  <!-- Logo -->
  <div
    class="w-11 h-11 rounded-2xl bg-violet-600
           flex items-center justify-center
           font-bold text-xl"
  >
    C
  </div>

  <!-- Navigation -->
  <nav class="flex flex-col items-center gap-6">

    <!-- Chats -->
    <button
      type="button"
      title="Chats"
      class="text-violet-400 hover:text-violet-300 transition-colors"
    >
      <svg
        lucideMessageCircle
        [size]="24"
        [strokeWidth]="2"
      ></svg>
    </button>

    <!-- Contacts -->
    <button
      type="button"
      title="Contacts"
      class="text-slate-400 hover:text-white transition-colors"
    >
      <svg
        lucideUsers
        [size]="24"
        [strokeWidth]="2"
      ></svg>
    </button>

    <!-- Groups -->
    <button
      type="button"
      title="Groups"
      class="text-slate-400 hover:text-white transition-colors"
    >
      <svg
        lucideUserRound
        [size]="24"
        [strokeWidth]="2"
      ></svg>
    </button>

  </nav>

  <!-- Bottom -->
  <div class="mt-auto flex flex-col items-center">

    <!-- Settings -->
    <button
      type="button"
      title="Settings"
      class="text-slate-400 hover:text-white transition-colors"
    >
      <svg
        lucideSettings
        [size]="24"
        [strokeWidth]="2"
      ></svg>
    </button>

    <!-- Profile -->
    <div
      class="w-10 h-10 mt-5 rounded-full bg-violet-500
             flex items-center justify-center
             font-semibold"
    >
      RP
    </div>

  </div>

</aside>
