<div class="p-4 bg-white border-t border-slate-200 shrink-0">

  <div class="flex items-center gap-3">

    <!-- Attachment -->
    <button
      type="button"
      title="Attach file"
      class="w-11 h-11 rounded-xl
             flex items-center justify-center
             text-slate-500
             hover:bg-slate-100
             hover:text-violet-600
             transition-colors"
    >
      <svg
        lucidePaperclip
        [size]="20"
        [strokeWidth]="2"
      ></svg>
    </button>

    <!-- Message Input -->
    <input
      type="text"
      placeholder="Type your message..."
      [ngModel]="message()"
      (ngModelChange)="message.set($event)"
      (keydown)="handleKeydown($event)"
      class="flex-1 rounded-xl bg-slate-100
             px-5 py-3
             outline-none
             focus:ring-2 focus:ring-violet-500"
    />

    <!-- Send -->
    <button
      type="button"
      title="Send message"
      (click)="sendMessage()"
      class="w-11 h-11 rounded-xl
             bg-violet-600 text-white
             flex items-center justify-center
             hover:bg-violet-700
             transition-colors"
    >
      <svg
        lucideSend
        [size]="20"
        [strokeWidth]="2"
      ></svg>
    </button>

  </div>

</div>
