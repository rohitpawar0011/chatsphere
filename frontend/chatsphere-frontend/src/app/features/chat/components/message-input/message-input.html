<div class="p-4 bg-white border-t border-slate-200 shrink-0">

  <div class="flex items-center gap-3">

    <!-- Attachment -->
    <button
      type="button"
      class="text-slate-500 hover:text-violet-600
             text-xl transition-colors"
      title="Attach file">
      +
    </button>

    <!-- Message Input -->
    <input
      type="text"
      placeholder="Type your message..."
      [ngModel]="message()"
      (ngModelChange)="message.set($event)"
      (keydown)="handleKeydown($event)"
      class="flex-1 rounded-xl bg-slate-100
             px-5 py-3 outline-none
             focus:ring-2 focus:ring-violet-500"
    />

    <!-- Send -->
    <button
      type="button"
      (click)="sendMessage()"
      class="rounded-xl bg-violet-600
             px-6 py-3 text-white font-medium
             hover:bg-violet-700
             transition-colors">
      Send
    </button>

  </div>

</div>
