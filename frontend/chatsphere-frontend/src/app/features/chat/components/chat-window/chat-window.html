@if (chatService.selectedConversation(); as conversation) {

  <section class="flex flex-col flex-1 min-w-0 h-full bg-slate-50">

    <!-- Chat Header -->
<header class="h-[76px] px-3 sm:px-6 bg-white border-b
               border-slate-200 flex items-center gap-3 shrink-0">

  <!-- Mobile Back Button -->
  <button
    type="button"
    class="lg:hidden p-2 -ml-2 text-slate-600
           hover:bg-slate-100 rounded-full"
    (click)="goBack()"
  >
    ←
  </button>

  <div class="w-9 h-9 sm:w-11 sm:h-11 rounded-full bg-violet-200
              flex items-center justify-center
              font-bold text-violet-700 shrink-0">
    {{ conversation.initials }}
  </div>

  <div class="min-w-0">
    <h2 class="font-semibold text-slate-900 truncate">
      {{ conversation.name }}
    </h2>

    <p class="text-xs"
       [class.text-green-600]="conversation.online"
       [class.text-slate-400]="!conversation.online">

      {{ conversation.online ? 'Online' : 'Offline' }}

    </p>
  </div>

</header>

    <!-- Messages -->
    <app-message-list />

    <!-- Message Input -->
    <app-message-input />

  </section>

} @else {

  <div class="flex-1 flex items-center justify-center text-slate-500">
    Select a conversation to start chatting.
  </div>

}
