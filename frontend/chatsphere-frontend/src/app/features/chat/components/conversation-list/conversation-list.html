
<aside class="w-[340px] h-full border-r border-slate-200
             flex flex-col bg-white shrink-0">

  <!-- Header -->
  <div class="p-5">
    <h1 class="text-2xl font-bold text-slate-900">
      Messages
    </h1>

    <input
      type="text"
      placeholder="Search conversations..."
      class="mt-5 w-full rounded-xl bg-slate-100
             px-4 py-3 outline-none
             focus:ring-2 focus:ring-violet-500"
    />
  </div>

  <!-- Recent Chats -->
  <div class="px-5 pb-3">
    <h2 class="text-sm font-semibold text-slate-500">
      RECENT CHATS
    </h2>
  </div>

  <!-- Dynamic Conversation List -->
  <div class="flex-1 overflow-y-auto">

    @for (
      conversation of chatService.conversations();
      track conversation.id
    ) {

      <button
        (click)="selectConversation(conversation.id)"
        class="w-full flex items-center gap-3
               px-5 py-4 text-left transition-colors"
        [class.bg-violet-50]="
          chatService.selectedConversationId() === conversation.id
        "
        [class.hover:bg-slate-50]="
          chatService.selectedConversationId() !== conversation.id
        "
      >

        <!-- Avatar -->
        <div class="w-12 h-12 rounded-full bg-violet-200
                    flex items-center justify-center
                    font-bold text-violet-700 shrink-0">
          {{ conversation.initials }}
        </div>

        <!-- User Details -->
        <div class="flex-1 min-w-0">

          <p class="font-semibold text-slate-900">
            {{ conversation.name }}
          </p>

          <p class="text-sm text-slate-500 truncate">
            {{ conversation.lastMessage }}
          </p>

        </div>

        <!-- Time and Unread Count -->
        <div class="flex flex-col items-end gap-1">

          <span class="text-xs text-slate-400">
            {{ conversation.updatedAt | date:'shortTime' }}
          </span>

          @if (conversation.unreadCount > 0) {
            <span class="min-w-5 h-5 px-1 rounded-full
                         bg-violet-600 text-white
                         text-xs flex items-center justify-center">
              {{ conversation.unreadCount }}
            </span>
          }

        </div>

      </button>

    } @empty {
      <p class="p-5 text-sm text-slate-500">
        No conversations found.
      </p>
    }

  </div>

</aside>
