
<div class="flex-1 overflow-y-auto p-6 space-y-5">

  @if (chatService.selectedConversation(); as conversation) {

    @for (message of conversation.messages; track message.id) {

      <div
        class="flex"
        [class.justify-end]="message.sender === 'me'"
        [class.justify-start]="message.sender === 'other'"
      >

        <div
          class="max-w-[70%] rounded-2xl px-4 py-3 shadow-sm"
          [class.bg-violet-600]="message.sender === 'me'"
          [class.text-white]="message.sender === 'me'"
          [class.bg-white]="message.sender === 'other'"
          [class.text-slate-800]="message.sender === 'other'"
          [class.rounded-tr-none]="message.sender === 'me'"
          [class.rounded-tl-none]="message.sender === 'other'"
        >

          <p class="text-sm">
            {{ message.content }}
          </p>

          <span class="text-xs opacity-70">
            {{ message.createdAt | date:'shortTime' }}
          </span>

        </div>

      </div>

    } @empty {

      <p class="text-center text-slate-400 text-sm">
        No messages yet. Start a conversation!
      </p>

    }

  }

</div>
