
<div class="flex h-full min-h-0 w-full overflow-hidden bg-white">

  <!-- Conversation List -->
  <div
    class="w-full min-h-0 overflow-hidden lg:w-auto"
    [class.hidden]="chatService.selectedConversation()"
    [class.lg:block]="true"
  >
    <app-conversation-list />
  </div>

  <!-- Chat Window -->
  <div
    class="flex-1 min-w-0 min-h-0 overflow-hidden"
    [class.hidden]="!chatService.selectedConversation()"
    [class.lg:block]="true"
  >
    <app-chat-window />
  </div>

</div>
